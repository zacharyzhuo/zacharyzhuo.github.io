<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gokigen_panda_icon.png" />
    <link rel="apple-touch-icon" href="/gokigen_panda_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F9F8F4" />
    <title>Trip Diaries</title>
    <meta name="description" content="個人旅行記錄與行程規劃" />

    <!-- Open Graph / 社群分享預設值（個別頁面會在 runtime 動態覆蓋） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trip Diaries" />
    <meta property="og:description" content="個人旅行記錄與行程規劃" />
    <meta property="og:image" content="/gokigen_panda_icon.png" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字型 CSS 改成 preload + onload swap：不阻塞 first paint，display:swap 期間顯示系統字 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 禁用雙指放大縮小（iOS Safari 10+ 忽略 user-scalable=no，需 JS 補充）
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault()
      }, { passive: false })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
