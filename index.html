<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gokigen_panda_icon.png" />
    <link rel="apple-touch-icon" href="/gokigen_panda_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- ⚠️ 勿加 apple-mobile-web-app-capable / apple-mobile-web-app-status-bar-style：
         新版 iOS 對 status-bar-style "default" 的解釋是「跟隨系統外觀」（深色模式 = 黑狀態列），
         且該值在「加入主畫面」當下被捕捉、事後改網頁無效 —— 加了反而把狀態列鎖成會變黑（踩過）。
         也勿加 color-scheme / 帶 media 的 theme-color 變體：維持與已驗證會白的版本相同的最簡形狀。 -->
    <meta name="theme-color" content="#FBFAF5" />
    <title>Trip Diaries</title>
    <meta name="description" content="個人旅行記錄與行程規劃" />

    <!-- Open Graph / 社群分享預設值（個別頁面會在 runtime 動態覆蓋） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trip Diaries" />
    <meta property="og:description" content="個人旅行記錄與行程規劃" />
    <meta property="og:image" content="/gokigen_panda_icon.png" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 只載入全站主字型 Noto Serif JP；Noto Sans JP（font-sans）僅求婚彩蛋用到，改吃系統 sans-serif fallback，省一個 render-blocking family -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 禁用雙指放大縮小（iOS Safari 10+ 忽略 user-scalable=no，需 JS 補充）
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault()
      }, { passive: false })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
