<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gokigen_panda_icon.png" />
    <link rel="apple-touch-icon" href="/gokigen_panda_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 本站刻意純淺色：明確宣告 color-scheme + 兩種外觀模式同一個 theme-color，
         否則 iOS 深色模式下 standalone PWA 不採用淺色 theme-color、狀態列會變黑 -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFAF5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#FBFAF5" />
    <!-- iOS 加入主畫面的狀態列樣式（default = 淺底深字）；style 在加入主畫面當下被快取，改了要移除重加 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Trip Diaries</title>
    <meta name="description" content="個人旅行記錄與行程規劃" />

    <!-- Open Graph / 社群分享預設值（個別頁面會在 runtime 動態覆蓋） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trip Diaries" />
    <meta property="og:description" content="個人旅行記錄與行程規劃" />
    <meta property="og:image" content="/gokigen_panda_icon.png" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 只載入全站主字型 Noto Serif JP；Noto Sans JP（font-sans）僅求婚彩蛋用到，改吃系統 sans-serif fallback，省一個 render-blocking family -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 禁用雙指放大縮小（iOS Safari 10+ 忽略 user-scalable=no，需 JS 補充）
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault()
      }, { passive: false })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
