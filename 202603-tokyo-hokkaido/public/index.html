<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#5C6E58" />
    <meta
      name="description"
      content="2026 Tokyo & Hokkaido Trip"
    />
    
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/proposal-photos/gokigen_panda_icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/proposal-photos/gokigen_panda_icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/proposal-photos/gokigen_panda_icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="東京＆北海道旅行" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>2026 Tokyo & Hokkaido Trip</title>
    <meta property="og:title" content="2026 Tokyo & Hokkaido Trip" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="2026 Tokyo & Hokkaido Trip" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1200&q=80" />
    <meta name="twitter:title" content="2026 Tokyo & Hokkaido Trip" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:description" content="2026 Tokyo & Hokkaido Trip" />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1200&q=80" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->

    <!-- html2canvas – DOM snapshotter (for liquidGL) -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
      defer
    ></script>

    <!-- liquidGL – Ultra-light glassmorphism for the web -->
    <!-- Docs: https://github.com/naughtyduk/liquidGL -->
    <script
      src="https://cdn.jsdelivr.net/gh/naughtyduk/liquidGL@main/scripts/liquidGL.js"
      defer
    ></script>
  </body>
</html>
