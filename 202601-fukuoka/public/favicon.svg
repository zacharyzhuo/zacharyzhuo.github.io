<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 128 128" role="img" aria-label="Torii favicon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e31b23"/>
      <stop offset="1" stop-color="#b31217"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="128" height="128" fill="#ffffff"/>

  <!-- Top beam -->
  <g filter="url(#s)">
    <rect x="10" y="22" width="108" height="16" rx="8" fill="url(#g)"/>
    <rect x="18" y="38" width="92" height="10" rx="5" fill="#c9151c"/>

    <!-- Pillars -->
    <rect x="28" y="48" width="18" height="56" rx="6" fill="url(#g)"/>
    <rect x="82" y="48" width="18" height="56" rx="6" fill="url(#g)"/>

    <!-- Inner lintel -->
    <rect x="36" y="56" width="56" height="10" rx="5" fill="#c9151c"/>

    <!-- Base feet -->
    <rect x="20" y="100" width="34" height="10" rx="5" fill="#9f1015"/>
    <rect x="74" y="100" width="34" height="10" rx="5" fill="#9f1015"/>
  </g>
</svg>

